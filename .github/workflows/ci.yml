name: ci
on: [push, pull_request]
jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: windows-latest, name: msvc }
          - { os: ubuntu-latest,  name: gcc,   cxx: g++ }
          - { os: ubuntu-latest,  name: clang, cxx: clang++ }
    runs-on: ${{ matrix.os }}
    name: ${{ matrix.name }}
    steps:
      - uses: actions/checkout@v4
      - name: Configure
        shell: bash
        run: |
          if [ -n "${{ matrix.cxx }}" ]; then export CXX=${{ matrix.cxx }}; fi
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release
      - name: Build
        run: cmake --build build --config Release --parallel
      - name: Test
        # includes the golden-hash test: exact ops must match bit for bit across compilers
        run: ctest --test-dir build -C Release --output-on-failure
      - name: Build 32-bit add-on
        # sopt-timer.addon32 for 32-bit games (ReShade loads .addon32 there)
        if: matrix.name == 'msvc'
        run: |
          cmake -S . -B build32 -A Win32 -DSOPT_BUILD_TESTS=OFF
          cmake --build build32 --config Release --target sopt-timer
      - name: Stage Windows tools
        # One flat folder: the artifact is extracted next to ReShade and the test package and
        # run with run-bench.bat (tools/windows/README.md).
        if: matrix.name == 'msvc'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          Copy-Item build/Release/sopt-host.exe, build/Release/sopt-timer.addon64, build32/Release/sopt-timer.addon32, build/Release/sopt-fxc.exe, tools/windows/README.md, tools/windows/run-bench.bat, tools/windows/run-bench.ps1, tools/windows/timer/timings.py dist/
      - name: Upload Windows tools
        # sopt-host, sopt-timer (M4 harness), the one-click bench and sopt-fxc
        if: matrix.name == 'msvc'
        uses: actions/upload-artifact@v4
        with:
          name: sopt-windows-tools
          path: dist/
