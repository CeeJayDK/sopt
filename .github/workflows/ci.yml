name: ci
on: [push, pull_request]
jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: windows-latest, name: msvc }
          - { os: ubuntu-latest,  name: gcc,   cxx: g++ }
          - { os: ubuntu-latest,  name: clang, cxx: clang++ }
    runs-on: ${{ matrix.os }}
    name: ${{ matrix.name }}
    steps:
      - uses: actions/checkout@v4
      - name: Configure
        shell: bash
        run: |
          if [ -n "${{ matrix.cxx }}" ]; then export CXX=${{ matrix.cxx }}; fi
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release
      - name: Build
        run: cmake --build build --config Release --parallel
      - name: Test
        # includes the golden-hash test: exact ops must match bit for bit across compilers
        run: ctest --test-dir build -C Release --output-on-failure
      - name: Build 32-bit add-on
        # sopt-timer.addon32 for 32-bit games (ReShade loads .addon32 there)
        if: matrix.name == 'msvc'
        run: |
          cmake -S . -B build32 -A Win32 -DSOPT_BUILD_TESTS=OFF
          cmake --build build32 --config Release --target sopt-timer
      - name: Cache ReShade build
        # ReShade 6.8.0, 64-bit, full add-on support, unchanged: run-bench.bat needs it next to
        # sopt-host (built once, then cached).
        if: matrix.name == 'msvc'
        id: reshade-cache
        uses: actions/cache@v4
        with:
          path: reshade-bin
          key: reshade-6.8.0-release-x64-v1
      - name: MSBuild for ReShade
        if: matrix.name == 'msvc' && steps.reshade-cache.outputs.cache-hit != 'true'
        uses: microsoft/setup-msbuild@v2
      - name: Build ReShade
        if: matrix.name == 'msvc' && steps.reshade-cache.outputs.cache-hit != 'true'
        shell: bash
        run: |
          git clone --depth 1 --branch v6.8.0 --recurse-submodules --shallow-submodules https://github.com/crosire/reshade reshade
          touch reshade/res/shaders/*.spv
          cd reshade
          MSYS_NO_PATHCONV=1 msbuild.exe ReShade.sln /t:ReShade /p:Configuration=Release /p:Platform=64-bit /m /v:minimal
          mkdir -p ../reshade-bin
          cp bin/x64/Release/ReShade64.dll ../reshade-bin/
          cp LICENSE.md ../reshade-bin/ReShade-LICENSE.md
      - name: Stage Windows tools
        # One flat folder: the artifact is extracted next to ReShade and the test package and
        # run with run-bench.bat (tools/windows/README.md).
        if: matrix.name == 'msvc'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          Copy-Item build/Release/sopt-host.exe, build/Release/sopt-timer.addon64, build32/Release/sopt-timer.addon32, build/Release/sopt-fxc.exe, build/Release/OpBench.exe, tools/windows/measure-gpu.bat, tools/windows/README.md, tools/windows/run-bench.bat, tools/windows/run-bench.ps1, tools/windows/timer/timings.py, reshade-bin/ReShade64.dll, reshade-bin/ReShade-LICENSE.md dist/
          Copy-Item build/Release/TexBench.exe, tools/windows/measure-textures.bat, tools/windows/measure-main-gpu.bat, tools/windows/measure-all-gpus.bat, tools/windows/GPU-Bench.bat, build/Release/ShaderInfo.exe, tools/windows/shader-info.bat dist/
          Copy-Item tools/windows/texbench/TESTS.txt dist/TexBench-TESTS.txt
          Copy-Item tools/windows/opbench/TESTS.txt dist/OpBench-TESTS.txt
      - name: Upload Windows tools
        # sopt-host, sopt-timer (M4 harness), the one-click bench, ReShade64.dll, OpBench, sopt-fxc
        if: matrix.name == 'msvc'
        uses: actions/upload-artifact@v4
        with:
          name: sopt-windows-tools
          path: dist/
