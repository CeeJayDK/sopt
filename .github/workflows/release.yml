name: release
# A GitHub Release: a tag v* (or a manual run, which makes a draft) builds sopt / sopt-fx for
# Windows and Linux and the Windows tools, signs the Windows files through SignPath once the
# project is approved there (docs/signing.md; skipped while the SIGNPATH_API_TOKEN secret does not
# exist) and attaches the zips, the Linux tarball and SHA256SUMS.txt.
on:
  push:
    tags: ['v*']
  workflow_dispatch:
permissions:
  contents: write
  actions: read
jobs:
  windows:
    runs-on: windows-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      signed: ${{ steps.files.outputs.signed }}
    env:
      SIGNPATH_API_TOKEN: ${{ secrets.SIGNPATH_API_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - name: Version
        id: version
        shell: bash
        run: |
          v=$(sed -n 's/^project(sopt VERSION \([0-9.]*\).*/\1/p' CMakeLists.txt)
          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then v="${GITHUB_REF_NAME#v}"; fi
          echo "version=$v" >> "$GITHUB_OUTPUT"
      - name: Build
        run: |
          cmake -S . -B build -DSOPT_BUILD_TESTS=OFF
          cmake --build build --config Release --parallel
          cmake -S . -B build32 -A Win32 -DSOPT_BUILD_TESTS=OFF
          cmake --build build32 --config Release --target sopt-timer
      - name: Cache ReShade build
        # the same unchanged ReShade 6.8.0 build as ci.yml (shared cache key)
        id: reshade-cache
        uses: actions/cache@v4
        with:
          path: reshade-bin
          key: reshade-6.8.0-release-x64-v1
      - name: MSBuild for ReShade
        if: steps.reshade-cache.outputs.cache-hit != 'true'
        uses: microsoft/setup-msbuild@v2
      - name: Build ReShade
        if: steps.reshade-cache.outputs.cache-hit != 'true'
        shell: bash
        run: |
          git clone --depth 1 --branch v6.8.0 --recurse-submodules --shallow-submodules https://github.com/crosire/reshade reshade
          touch reshade/res/shaders/*.spv
          cd reshade
          MSYS_NO_PATHCONV=1 msbuild.exe ReShade.sln /t:ReShade /p:Configuration=Release /p:Platform=64-bit /m /v:minimal
          mkdir -p ../reshade-bin
          cp bin/x64/Release/ReShade64.dll ../reshade-bin/
          cp LICENSE.md ../reshade-bin/ReShade-LICENSE.md
      - name: Version info check
        shell: pwsh
        run: |
          foreach ($f in 'build/Release/sopt.exe', 'build/Release/sopt-fx.exe', 'build/Release/OpBench.exe', 'build/Release/TexBench.exe', 'build/Release/ShaderInfo.exe', 'build/Release/sopt-host.exe', 'build/Release/sopt-fxc.exe', 'build/Release/sopt-timer.addon64', 'build32/Release/sopt-timer.addon32') {
            $v = (Get-Item $f).VersionInfo
            "{0}: {1} {2} ({3})" -f $f, $v.ProductName, $v.FileVersion, $v.CompanyName
            if ($v.CompanyName -ne 'CeeJay.dk') { throw "$f has no version resource" }
          }
      - name: Stage zips
        shell: pwsh
        run: |
          $v = '${{ steps.version.outputs.version }}'
          # Layouts in tools/windows/stage.ps1 (owner, 2026-10-05): launcher + README.html, programs in bin\, Docs\.
          tools/windows/stage.ps1 -Out stage
          New-Item -ItemType Directory -Force -Path unsigned | Out-Null
          Compress-Archive -Path stage/SweetOpt/* -DestinationPath "unsigned/SweetOpt-$v-windows-x64.zip"
          Compress-Archive -Path stage/GPU-Blueprint/* -DestinationPath "unsigned/GPU-Blueprint-$v.zip"
          Compress-Archive -Path stage/tools/* -DestinationPath "unsigned/sopt-windows-tools-$v.zip"
      - name: Upload unsigned
        id: upload
        uses: actions/upload-artifact@v4
        with:
          name: unsigned
          path: unsigned/
      - name: Sign (SignPath)
        # our binaries only (artifact configuration in docs/signing.md); ReShade64.dll is crosire's
        if: env.SIGNPATH_API_TOKEN != ''
        uses: signpath/github-action-submit-signing-request@v1
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
          project-slug: ${{ vars.SIGNPATH_PROJECT_SLUG }}
          signing-policy-slug: ${{ vars.SIGNPATH_POLICY_SLUG }}
          github-artifact-id: ${{ steps.upload.outputs.artifact-id }}
          wait-for-completion: true
          output-artifact-directory: signed
      - name: Collect release files
        id: files
        shell: bash
        run: |
          if [ -n "$SIGNPATH_API_TOKEN" ]; then src=signed; echo "signed=yes" >> "$GITHUB_OUTPUT"; else src=unsigned; echo "signed=no" >> "$GITHUB_OUTPUT"; fi
          mkdir -p release
          cp "$src"/*.zip release/
      - name: Upload release files
        uses: actions/upload-artifact@v4
        with:
          name: release-windows
          path: release/
  linux:
    # sopt and sopt-fx for Linux x64; Ubuntu 22.04's glibc so the binaries run on older systems
    # too, libstdc++ / libgcc linked statically.
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - name: Build
        run: |
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DSOPT_BUILD_TESTS=OFF \
            -DCMAKE_EXE_LINKER_FLAGS="-static-libstdc++ -static-libgcc"
          cmake --build build --parallel --target sopt sopt-fx
      - name: Package
        run: |
          v=$(sed -n 's/^project(sopt VERSION \([0-9.]*\).*/\1/p' CMakeLists.txt)
          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then v="${GITHUB_REF_NAME#v}"; fi
          d=SweetOpt-$v-linux-x64
          mkdir -p $d/bin $d/Docs release
          cp build/sopt build/sopt-fx $d/bin/
          cp docs/sweetopt/README.html $d/README.html
          cp tools/windows/docs/style.css $d/Docs/
          cp LICENSE $d/Docs/LICENSE.txt
          ./$d/bin/sopt --version && ./$d/bin/sopt-fx --version
          tar czf release/$d.tar.gz $d
      - name: Upload release files
        uses: actions/upload-artifact@v4
        with:
          name: release-linux
          path: release/
  release:
    needs: [windows, linux]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: release-*
          merge-multiple: true
          path: release
      - name: Checksums
        run: cd release && sha256sum * > SHA256SUMS.txt && cat SHA256SUMS.txt
      - uses: actions/checkout@v4
        with:
          path: src
          sparse-checkout: CHANGELOG.md
          sparse-checkout-cone-mode: false
      - name: Release notes
        env:
          VERSION: ${{ needs.windows.outputs.version }}
          SIGNED: ${{ needs.windows.outputs.signed }}
        run: |
          # The CHANGELOG.md section "## <version>" (up to the next "## ") becomes "What's new".
          awk -v h="## $VERSION" '$0 == h { on = 1; next } on && /^## / { exit } on' src/CHANGELOG.md > whatsnew.md
          if ! grep -q '[^[:space:]]' whatsnew.md; then
            echo "::warning::CHANGELOG.md has no section '## $VERSION'"
            echo "(no notes for this version in CHANGELOG.md)" > whatsnew.md
          fi
          if [ "$SIGNED" = yes ]; then signing="signed through SignPath Foundation."
          else signing="not signed yet (SignPath application pending); Windows Defender may warn. Check the files against SHA256SUMS.txt."; fi
          {
            echo "sopt $VERSION."
            echo
            echo "## What's new"
            cat whatsnew.md
            echo
            echo "## Downloads"
            echo
            echo "- \`SweetOpt-$VERSION-windows-x64.zip\` / \`SweetOpt-$VERSION-linux-x64.tar.gz\`: SweetOpt, the super sweet shader optimizer: sopt-fx (finds cheaper, verified rewrites of the arithmetic in ReShade FX and HLSL pixel shaders, written next to the originals behind preprocessor switches) and sopt (single expressions); on Windows, double-click SweetOpt.bat. Early release: start with README.html inside, and send feedback at https://github.com/CeeJayDK/sopt/issues. Windows needs the VC++ 2015-2022 redistributable (most gaming PCs have it)."
            echo "- \`GPU-Blueprint-$VERSION.zip\`: measures your graphics card for SweetOpt: OpBench (what math instructions cost), TexBench (texture reads, writes, blending) and ShaderInfo (what the driver reports about compiled shaders), each with a score at the end. Unzip, double-click \`GPU-Blueprint.bat\` (a menu); when a run is done it offers to send the reports (README.html inside explains everything)."
            echo "- \`sopt-windows-tools-$VERSION.zip\`: the benchmark harness that times SweetOpt's variants in ReShade (run-bench.bat, sopt-host, sopt-timer add-on, ReShade64.dll 6.8.0)."
            echo
            echo "Code signing: $signing"
          } > notes.md
          cat notes.md
      - name: GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          draft: ${{ github.event_name == 'workflow_dispatch' }}
          prerelease: ${{ contains(github.ref_name, '-') }}
          tag_name: ${{ github.ref_type == 'tag' && github.ref_name || format('v{0}', needs.windows.outputs.version) }}
          name: sopt ${{ needs.windows.outputs.version }}
          files: release/*
          body_path: notes.md
