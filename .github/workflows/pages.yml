# SweetOpt / GPU Blueprint web pages (owner, 2026-10-05; ceejay.dk/sopt/): SweetOpt, the rewrite library, the cost
# models with the cards behind them, and the TexBench findings with the pixel order pictures, published with GitHub Pages.
# Runs on GitHub's servers by itself: on every change to main that touches the models, the library, the reports or
# the page (pull requests only build it, as a check). Pictures are published as they are; optimize-pngs.yml
# optimizes new ones losslessly in the background and starts this workflow again after each batch.
# One-time setup by the repository owner: Settings > Pages > Source: GitHub Actions (the user site CeeJayDK.github.io
# carries the ceejay.dk domain, so this project appears at ceejay.dk/sopt/).
name: pages
on:
  push:
    branches: [main]
    paths:
      - "site/**"
      - "tools/site/**"
      - "docs/opbench/**"
      - "docs/texbench/**"
      - "library/**"
      - "src/ir/ops.cpp"
      - "src/cli/main.cpp"
      - ".github/workflows/pages.yml"
  pull_request:
    paths:
      - "site/**"
      - "tools/site/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Cost models and library
        run: |
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release
          cmake --build build --target sopt --parallel
          build/sopt --cost-models-json > models.json
          build/sopt --library-json > library.json
      - name: Page
        run: python3 tools/site/build.py models.json library.json _site
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
  deploy:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
