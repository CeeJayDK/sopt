# Lossless PNG optimization for the web pages (owner, 2026-10-05: do not hold up the page release; optimize in the
# background so the published pictures are replaced by optimized ones gradually; never optimize a file twice).
# The pages workflow publishes the pictures as they are. This workflow optimizes the ones not yet done (oxipng -o max
# --zopfli, else zopflipng), commits them to main in batches (about every 10 minutes of work and at the end) and asks
# the pages workflow to republish after each batch. docs/texbench/png-optimized.txt holds the SHA-256 of every file
# it optimized: a file whose current hash is listed is skipped, a replaced file (new hash) is optimized again.
# Commits made with GITHUB_TOKEN start no workflows, so this cannot loop; the pages run is started explicitly.
name: optimize-pngs
on:
  push:
    branches: [main]
    paths:
      - "docs/texbench/*.png"
  schedule:
    - cron: "17 3 * * 1"  # weekly safety net (picks up anything a cancelled run left)
  workflow_dispatch:

permissions:
  contents: write
  actions: write

concurrency:
  group: optimize-pngs
  cancel-in-progress: false

jobs:
  optimize:
    runs-on: ubuntu-24.04
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Find pictures not optimized yet
        id: todo
        run: |
          manifest=docs/texbench/png-optimized.txt
          touch "$manifest"
          : > todo.txt
          shopt -s nullglob
          for f in docs/texbench/*.png; do
            h=$(sha256sum "$f" | cut -d' ' -f1)
            grep -q "^$h " "$manifest" || echo "$f" >> todo.txt
          done
          echo "count=$(wc -l < todo.txt)" >> "$GITHUB_OUTPUT"
          cat todo.txt
      - name: Tools
        if: steps.todo.outputs.count != '0'
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q oxipng || sudo apt-get install -y -q zopfli
      - name: Optimize, commit in batches, republish
        if: steps.todo.outputs.count != '0'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          manifest=docs/texbench/png-optimized.txt
          git config user.name "github-actions[bot]"
          git config user.email "41898299+github-actions[bot]@users.noreply.github.com"
          publish() {
            sort -k2 -o "$manifest" "$manifest"
            git add docs/texbench
            git diff --cached --quiet && return 0
            git commit -q -m "Optimize PNGs losslessly ($1)"
            for i in 1 2 3 4; do
              git pull -q --rebase origin main && git push -q origin HEAD:main && break
              sleep $((i * 5))
            done
            gh workflow run pages.yml --ref main || echo "could not start the pages workflow"
          }
          last=$(date +%s)
          done_count=0
          while read -r f; do
            [ -f "$f" ] || continue
            before=$(stat -c %s "$f")
            if command -v oxipng >/dev/null; then
              oxipng -q -o max --zopfli --strip safe "$f"
            else
              zopflipng -y -m --iterations=100 "$f" "$f" >/dev/null
            fi
            name=$(basename "$f")
            h=$(sha256sum "$f" | cut -d' ' -f1)
            awk -v n="$name" '$2 != n' "$manifest" > "$manifest.tmp"
            echo "$h  $name" >> "$manifest.tmp"
            mv "$manifest.tmp" "$manifest"
            echo "$name: $before -> $(stat -c %s "$f") bytes"
            done_count=$((done_count + 1))
            if [ $(( $(date +%s) - last )) -ge 600 ]; then
              publish "$done_count so far"
              last=$(date +%s)
            fi
          done < todo.txt
          publish "$done_count files"
